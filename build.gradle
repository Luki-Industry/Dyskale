plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
    id 'idea'
}

group = 'com.lukienlive.hytale'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    if (providers.gradleProperty('hytale.useMaven').isPresent()) {
        maven {
            name = 'hytale'
            url = uri('https://maven.hytale.com/release')
        }
    }
}

dependencies {
    if (providers.gradleProperty('hytale.useMaven').isPresent()) {
        compileOnly 'com.hypixel.hytale:Server:+'
    } else {
        compileOnly files('libs/HytaleServer.jar')
    }

    implementation 'net.dv8tion:JDA:6.3.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'com.google.code.gson:gson:2.13.2'

    implementation 'com.google.inject:guice:7.0.0'

    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    compileOnly 'net.luckperms:api:5.4'
}

def readHytaleVersion = { File serverJar ->
    if (!serverJar.exists()) {
        return 'unknown'
    }

    def jarFile = new java.util.jar.JarFile(serverJar)
    try {
        return jarFile.manifest?.mainAttributes?.getValue('Implementation-Version') ?: 'unknown'
    } finally {
        jarFile.close()
    }
}

def installHytaleApi = { ->
    def libsDir = file('libs')
    def destinationFile = new File(libsDir, 'HytaleServer.jar')
    if (!libsDir.exists()) {
        libsDir.mkdirs()
    }

    def possiblePaths = []
    def appData = System.getenv("APPDATA")

    if (appData) {
        possiblePaths.add(new File(appData, "Hytale/install/release/package/game/latest/Server/HytaleServer.jar"))
    }
    possiblePaths.add(file("HytaleServer.jar"))
    possiblePaths.add(file("../HytaleServer.jar"))

    def sourceFile = possiblePaths.find { it.exists() }

    if (sourceFile == null) {
        return destinationFile.exists()
    }

    if (destinationFile.exists() && java.nio.file.Files.mismatch(sourceFile.toPath(), destinationFile.toPath()) == -1) {
        println "API Hytale déjà à jour: ${readHytaleVersion.call(destinationFile)}"
        return true
    }

    println "Serveur trouvé: ${sourceFile}"
    copy {
        from sourceFile
        into libsDir
        rename { 'HytaleServer.jar' }
    }
    println "API Hytale mise à jour: ${readHytaleVersion.call(destinationFile)}"
    return true
}

if (!file('libs/HytaleServer.jar').exists()) {
    installHytaleApi()
}

tasks.register('setupHytaleApi') {
    group = 'hytale'
    description = 'Copie HytaleServer.jar dans le dossier libs'

    doLast {
        if (providers.gradleProperty('hytale.useMaven').isPresent()) {
            println 'Mode CI: API Hytale résolue depuis le dépôt Maven.'
            return
        }

        if (file('libs/HytaleServer.jar').exists()) {
            println "Version API locale actuelle: ${readHytaleVersion.call(file('libs/HytaleServer.jar'))}"
        }

        if (!installHytaleApi()) {
            println "\nHytaleServer.jar non trouvé automatiquement."
            println "Veuillez copier HytaleServer.jar dans le dossier 'libs' du projet."
            throw new GradleException("HytaleServer.jar introuvable")
        }
    }
}

shadowJar {
    archiveBaseName.set('Dyskale')
    archiveClassifier.set('')
    mergeServiceFiles()

    relocate 'org.slf4j', 'com.lukienlive.hytale.shaded.slf4j'

    doFirst {
        manifest.attributes(
                'Dyskale-Built-Against-Hytale': readHytaleVersion.call(file('libs/HytaleServer.jar'))
        )
    }
}

tasks.register('printHytaleServerInfo') {
    group = 'hytale'
    description = 'Affiche les versions des API Hytale installée et utilisée par le projet'

    doLast {
        def installedJar = file("${System.getenv('APPDATA')}/Hytale/install/release/package/game/latest/Server/HytaleServer.jar")
        println "API de compilation: ${readHytaleVersion.call(file('libs/HytaleServer.jar'))}"
        println "Serveur Hytale installé: ${readHytaleVersion.call(installedJar)}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn 'setupHytaleApi'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

tasks.register('runHytaleServer', JavaExec) {
    dependsOn 'shadowJar'
    group = 'hytale'
    description = 'Runs the Hytale server for testing'
    classpath = files('libs/HytaleServer.jar')
    mainClass = 'com.hypixel.hytale.Main'

    def userHome = System.getProperty("user.home")
    def assetsPath = "${userHome}\\AppData\\Roaming\\Hytale\\install\\release\\package\\game\\latest\\Assets.zip"

    args = [
        "--allow-op",
        "--disable-sentry",
        "--assets", assetsPath
    ]

    jvmArgs("-Xmx2G")

    workingDir = project.file("run")

    doFirst {
        if (!workingDir.exists()) {
            workingDir.mkdirs()
        }

        def modsDir = new File(workingDir, "mods")
        if (!modsDir.exists()) {
            modsDir.mkdirs()
        }

        // Clean old jars
        modsDir.listFiles()?.each { file ->
            if ((file.name.startsWith("Hytale-Plugin") || file.name.startsWith("Dyskale")) && file.name.endsWith(".jar")) {
                file.delete()
            }
        }

        // Copy new jar
        copy {
            from shadowJar.archiveFile
            into modsDir
        }
    }

    standardInput = System.in
}

build.dependsOn shadowJar

