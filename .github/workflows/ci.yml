name: Dyskale CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build with Hytale Maven API
        run: bash ./gradlew build "-Phytale.useMaven=true" --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Dyskale-${{ github.sha }}
          path: build/libs/Dyskale-*.jar
