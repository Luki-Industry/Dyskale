name: Dyskale Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check version consistency
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $gradleVersion = (Select-String -Path build.gradle -Pattern "^version = '([^']+)'$").Matches[0].Groups[1].Value
          $manifestVersion = (Get-Content src/main/resources/manifest.json -Raw | ConvertFrom-Json).Version
          if ($tagVersion -ne $gradleVersion -or $tagVersion -ne $manifestVersion) {
            throw "Version mismatch: tag=$tagVersion, Gradle=$gradleVersion, manifest=$manifestVersion"
          }

      - name: Build release jar
        run: bash ./gradlew shadowJar "-Phytale.useMaven=true" --no-daemon

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/libs/Dyskale-*.jar
